name: Validate profile cards
on:
  workflow_dispatch:
  push:
    paths:
      - build-lab.mjs
      - widgets/**
      - .github/workflows/profile.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify generated cards
        run: |
          node build-lab.mjs
          git diff --exit-code -- widgets
