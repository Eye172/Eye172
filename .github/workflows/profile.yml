name: Refresh GitHub statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
  push:
    paths:
      - build-stats.mjs
      - .github/workflows/profile.yml
permissions:
  contents: write
concurrency:
  group: profile-statistics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Refresh public statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node build-stats.mjs
      - name: Publish changed cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add widgets README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public GitHub statistics'
            git push
          fi
