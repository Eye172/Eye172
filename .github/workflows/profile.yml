name: Refresh profile snapshot
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - render-profile.mjs
      - .github/workflows/profile.yml
permissions:
  contents: write
concurrency:
  group: profile-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Render public repository snapshot
        run: node render-profile.mjs --metrics-only
      - name: Save updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add activity-dark.svg activity-light.svg activity-mobile-dark.svg activity-mobile-light.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public repository snapshot'
            git push
          fi
