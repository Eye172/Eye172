name: Refresh profile snapshot
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - build-profile.mjs
      - .github/workflows/profile.yml
permissions:
  contents: write
concurrency:
  group: profile-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Render public repository snapshot
        run: node build-profile.mjs --metrics-only
      - name: Save updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add activity-dark.svg activity-light.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public repository snapshot'
            git push
          fi
