 <style>text{font-family:'Courier New',monospace}.title{font-family:Georgia,'Times New Roman',serif}.signal{animation:travel 5s linear infinite}.s1{animation-delay:-1.2s}.s2{animation-delay:-2.4s}.s3{animation-delay:-3.6s}.wave{animation:breathe 6s ease-in-out infinite;transform-origin:896px 108px}.cursor{animation:blink 1.4s steps(1) infinite}@keyframes travel{to{stroke-dashoffset:-208}}@keyframes breathe{0%,100%{transform:scaleY(.78)}50%{transform:scaleY(1.18)}}@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:0}}@media(prefers-reduced-motion:reduce){.signal,.wave,.cursor{animation:none}}</style>
